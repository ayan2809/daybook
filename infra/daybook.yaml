AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Daybook app (plan 12, DB-27): CloudFront in front of the PWA (S3) and the API (Lambda Function
  URL). Everything scales to zero: no servers, no VPC, no NAT, no API Gateway. The worker wakes only
  when the API hands it a job or a schedule fires at an exact time. Needs infra/storage.yaml first.

Parameters:
  CodeKey:
    Type: String
    Description: S3 key of the Lambda zip in the data bucket (artifacts/<git-sha>.zip)
  OriginVerify:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret header CloudFront adds; the API rejects requests without it (from SSM)
  EnableSchedules:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Per-account reminders + nightly cleanup (needs scheduler permissions on the deployer)
  AlertEmail:
    Type: String
    Default: ""
    Description: When set, an AWS Budgets alert emails this address (needs budgets permissions)
  MonthlyBudgetUsd:
    Type: Number
    Default: 5

Conditions:
  Schedules: !Equals [!Ref EnableSchedules, "true"]
  Budget: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------------------------------------------------------------- roles (least privilege)
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: daybook-api-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: daybook-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/daybook-*:*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - "${Arn}/*"
                  - Arn: !ImportValue daybook-data-bucket-arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue daybook-data-bucket-arn
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/daybook
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" }
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:daybook-worker
              - Effect: Allow
                # per-account reminder schedules, made by the app when Settings change (DB-29)
                Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
                Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/daybook-reminder-*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/daybook-scheduler-role
                Condition:
                  StringEquals: { "iam:PassedToService": scheduler.amazonaws.com }

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: daybook-worker-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: daybook-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:  # same as the API role minus the scheduler rights; finalize hands off the judge
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/daybook-*:*
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - "${Arn}/*"
                  - Arn: !ImportValue daybook-data-bucket-arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue daybook-data-bucket-arn
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/daybook
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" }
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:daybook-worker

  # ---------------------------------------------------------------- functions
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/daybook-api, RetentionInDays: 7 }

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/daybook-worker, RetentionInDays: 7 }

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: daybook-api
      Description: Daybook HTTP API (FastAPI via Mangum)
      Runtime: python3.12
      Architectures: [arm64]
      Handler: daybook.main.handler
      MemorySize: 1024
      Timeout: 29
      Role: !GetAtt ApiRole.Arn
      Code:
        S3Bucket: !ImportValue daybook-data-bucket
        S3Key: !Ref CodeKey
      LoggingConfig: { LogGroup: !Ref ApiLogs }
      Environment:
        Variables:
          DAYBOOK_ENV: prod
          DAYBOOK_BLOB: s3
          DAYBOOK_BUCKET: !ImportValue daybook-data-bucket
          DAYBOOK_DATA_DIR: /tmp/daybook
          DAYBOOK_SEED_DIR: /var/task/seed
          DAYBOOK_LLM: live
          DAYBOOK_EMBED: gemini
          DAYBOOK_TTS: elevenlabs
          WORKER_FUNCTION_NAME: daybook-worker
          SCHEDULER_ROLE_ARN: !If [Schedules, !Sub "arn:aws:iam::${AWS::AccountId}:role/daybook-scheduler-role", ""]
          WORKER_FUNCTION_ARN: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:daybook-worker
          SSM_PREFIX: /daybook

  # Public URL, but only CloudFront knows the X-Origin-Verify value the app requires.
  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # Since Oct 2025 a NONE-auth function URL needs both statements (Lambda docs, urls-auth).
  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogs
    Properties:
      FunctionName: daybook-worker
      Description: Daybook jobs (finalize, judge, reminders, cleanup)
      Runtime: python3.12
      Architectures: [arm64]
      Handler: daybook.worker.handler
      MemorySize: 1024
      Timeout: 300
      Role: !GetAtt WorkerRole.Arn
      Code:
        S3Bucket: !ImportValue daybook-data-bucket
        S3Key: !Ref CodeKey
      LoggingConfig: { LogGroup: !Ref WorkerLogs }
      Environment:
        Variables:
          DAYBOOK_ENV: prod
          DAYBOOK_BLOB: s3
          DAYBOOK_BUCKET: !ImportValue daybook-data-bucket
          DAYBOOK_DATA_DIR: /tmp/daybook
          DAYBOOK_SEED_DIR: /var/task/seed
          DAYBOOK_LLM: live
          DAYBOOK_EMBED: gemini
          DAYBOOK_TTS: elevenlabs
          WORKER_FUNCTION_NAME: daybook-worker
          SCHEDULER_ROLE_ARN: !If [Schedules, !Sub "arn:aws:iam::${AWS::AccountId}:role/daybook-scheduler-role", ""]
          WORKER_FUNCTION_ARN: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:daybook-worker
          SSM_PREFIX: /daybook

  WorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1  # every job is idempotent
      MaximumEventAgeInSeconds: 3600

  # ---------------------------------------------------------------- schedules (exact times only)
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: Schedules
    Properties:
      RoleName: daybook-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: daybook-scheduler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkerFunction.Arn

  # Once a night: end sessions left open and retry queued finalizes (demo sandboxes too).
  NightlyCleanup:
    Type: AWS::Scheduler::Schedule
    Condition: Schedules
    Properties:
      Name: daybook-nightly-cleanup
      Description: End stale sessions, retry queued finalizes
      ScheduleExpression: cron(45 23 * * ? *)
      ScheduleExpressionTimezone: Asia/Kolkata
      State: ENABLED
      FlexibleTimeWindow: { Mode: FLEXIBLE, MaximumWindowInMinutes: 15 }
      Target:
        Arn: !GetAtt WorkerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"job": "cleanup_stale_sessions"}'
        RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }

  # ---------------------------------------------------------------- CloudFront (one HTTPS domain)
  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: daybook-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # SPA routes: extension-less paths serve index.html. (Not custom error responses: those apply to
  # the whole distribution and would swallow API 404s.)
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: daybook-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite app routes to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var last = req.uri.split('/').pop();
          if (last.indexOf('.') === -1) { req.uri = '/index.html'; }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Daybook
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200  # includes India edges
        DefaultRootObject: index.html
        ViewerCertificate: { CloudFrontDefaultCertificate: true }
        Origins:
          - Id: web
            DomainName: !ImportValue daybook-web-bucket-domain
            OriginAccessControlId: !Ref WebOac
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerify
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue daybook-web-bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub
              - "${Arn}/*"
              - Arn: !ImportValue daybook-web-bucket-arn
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- cost alert (optional)
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: Budget
    Properties:
      Budget:
        BudgetName: daybook-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 20
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  ApiFunctionUrl:
    Value: !GetAtt ApiUrl.FunctionUrl
