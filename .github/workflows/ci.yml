name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check daybook tests scripts
      - run: uv run ruff format --check daybook tests scripts
      - run: uv run pytest -q
      - name: seed + eval data check
        working-directory: .
        run: python3 evals/check_data.py
      - name: evals (fake mode)
        working-directory: .
        run: uv run --project backend python -m evals run --suite all --mode fake

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
